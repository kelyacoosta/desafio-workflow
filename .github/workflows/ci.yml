
name: Esteira CI

on:
  push:
    branches:
      - main

jobs:

  validar-html:
    name: Validar HTML
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar HTMLHint
        run: npm install -g htmlhint

      - name: Validar HTML
        run: htmlhint index.html

  validar-css:
    name: Validar CSS
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar CSS
        run: |
          if grep -q "ERRO_CSS" style.css; then
            echo "Erro encontrado no CSS!"
            exit 1
          else
            echo "CSS validado com sucesso!"
          fi

  preparar-entrega:
    name: Preparar Entrega
    runs-on: ubuntu-latest
    needs: [validar-html, validar-css]

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar pasta dist
        run: mkdir -p dist

      - name: Copiar arquivos
        run: cp index.html style.css dist/

      - name: Confirmar entrega
        run: ls -la dist
